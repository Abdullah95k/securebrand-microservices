# Dependabot: weekly pull requests for Go modules, the GitHub Actions the
# workflows use, and the Docker base images. Each goes through CI like any
# change; security updates come as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly, day: sunday}
    open-pull-requests-limit: 5
    # The TLS and HTTP/2 client fbs reaches Facebook with: an update can
    # change what Facebook sees, and how fbs reaches Facebook doesn't change
    # without the owner (7 November). Updated by hand, after a check against
    # real Facebook; govulncheck in CI still reports their vulnerabilities.
    ignore:
      - dependency-name: "github.com/bogdanfinn/*"
    groups:
      go-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: sunday}
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule: {interval: weekly, day: sunday}
