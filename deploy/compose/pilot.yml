# Pilot overlay for docker-compose.yml: the real pipeline against real
# Facebook on one machine (docs/runbooks/pilot.md). `make pilot-up` runs:
#   docker compose -f docker-compose.yml -f pilot.yml up -d
# Differences from the local stack:
# - config: phase0/proxies.yaml + pilot.yaml + pilot-run.yaml (written by
#   `make pilot-up`: the requests/s per IP and the canary pages), never
#   local.yaml, whose fakefb pacing must not reach Facebook;
# - every port is bound to 127.0.0.1 (the stack's Postgres password is "fbs");
# - no fakefb; the Phase 0 registry is imported before the crawler starts;
# - the fbs services run as root in their containers, to read proxies.yaml
#   (mode 600, owned by root), but with no Linux capabilities;
# - everything restarts after a reboot or a Docker restart, Redpanda and
#   Valkey keep their data in volumes (queued tasks, job accounting,
#   checkpoints and post caches survive a container recreate), and
#   container logs are rotated (3 x 50 MB per service), so the disk can't
#   fill up with them.

x-logging: &logging
  driver: json-file
  options: {max-size: "50m", max-file: "3"}

x-pilot: &pilot
  user: "0:0"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *logging
  environment:
    FBS_CONFIG: /etc/fbs/proxies.yaml,/etc/fbs/pilot.yaml,/etc/fbs/pilot-run.yaml
    FBS_FB__BASE_URL: https://www.facebook.com
  volumes:
    - ../../phase0/proxies.yaml:/etc/fbs/proxies.yaml:ro
    - ./pilot.yaml:/etc/fbs/pilot.yaml:ro
    - ../../phase0/out/pilot-run.yaml:/etc/fbs/pilot-run.yaml:ro

services:
  postgres:
    ports: !override ["127.0.0.1:5432:5432"]
    restart: unless-stopped
    logging: *logging
  redpanda:
    ports: !override ["127.0.0.1:19092:19092", "127.0.0.1:18081:8081"]
    restart: unless-stopped
    logging: *logging
    volumes: [redpanda-data:/var/lib/redpanda/data]
  valkey:
    ports: !override ["127.0.0.1:6379:6379"]
    restart: unless-stopped
    logging: *logging
    # Job accounting, checkpoints and post caches survive a recreate
    # (`make pilot-up` recreates every container).
    command: ["valkey-server", "--appendonly", "yes"]
    volumes: [valkey-data:/data]
  s3:
    ports: !override ["127.0.0.1:9000:9000"]
    restart: unless-stopped
    logging: *logging
  fakefb:
    profiles: ["fakefb"] # not started

  init: *pilot
  topics: *pilot
  schemas: *pilot

  # The Phase 0 doc_ids become the active registry entries.
  pilot-registry:
    image: ${FBS_IMAGE:-fbs:dev}
    <<: *pilot
    environment:
      FBS_CONFIG: /etc/fbs/proxies.yaml,/etc/fbs/pilot.yaml,/etc/fbs/pilot-run.yaml
      FBS_POSTGRES__DSN: postgres://fbs:fbs@postgres:5432/fbs?sslmode=disable
    volumes:
      - ../../phase0/proxies.yaml:/etc/fbs/proxies.yaml:ro
      - ./pilot.yaml:/etc/fbs/pilot.yaml:ro
      - ../../phase0/out/pilot-run.yaml:/etc/fbs/pilot-run.yaml:ro
      - ../../phase0/out/registry.yaml:/etc/fbs/registry.yaml:ro
    # Only over the seed's placeholders: a restart keeps what registry-sync promoted.
    entrypoint: ["/usr/local/bin/fbctl", "registry", "import", "--keep-promoted", "--file", "/etc/fbs/registry.yaml"]
    depends_on:
      init: {condition: service_completed_successfully}

  api:
    <<: *pilot
    ports: !override ["127.0.0.1:8080:8080"]
  scheduler: *pilot
  crawler:
    <<: *pilot
    depends_on:
      pilot-registry: {condition: service_completed_successfully}
  persister: *pilot
  media-downloader: *pilot
  media-janitor: *pilot
  registry-sync:
    <<: *pilot
    depends_on:
      pilot-registry: {condition: service_completed_successfully}

volumes:
  redpanda-data: {}
  valkey-data: {}
