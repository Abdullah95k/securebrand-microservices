# Local stack: infrastructure + every fbs service + fakefb.
#   make compose-up        build the image and start everything
#   make compose-down
# The crawler points at fakefb (a synthetic Facebook). To try real Facebook
# set FBS_FB__BASE_URL=https://www.facebook.com and configure proxies in
# deploy/compose/local.yaml first (see docs/runbooks/phase0-spike.md).
name: fbs

x-fbs: &fbs
  image: ${FBS_IMAGE:-fbs:dev}
  restart: unless-stopped
  environment: &fbs-env
    FBS_CONFIG: /etc/fbs/local.yaml
    FBS_POSTGRES__DSN: postgres://fbs:fbs@postgres:5432/fbs?sslmode=disable
    FBS_REDIS__ADDR: valkey:6379
    FBS_KAFKA__BROKERS: redpanda:9092
    FBS_S3__ENDPOINT: s3:9000
    FBS_FB__BASE_URL: ${FBS_FB_BASE_URL:-http://fakefb:8090}
  volumes:
    - ./local.yaml:/etc/fbs/local.yaml:ro
  depends_on:
    init: {condition: service_completed_successfully}
    topics: {condition: service_completed_successfully}
    valkey: {condition: service_healthy}

services:
  postgres:
    image: postgres:18-alpine
    environment: {POSTGRES_USER: fbs, POSTGRES_PASSWORD: fbs, POSTGRES_DB: fbs}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "fbs"], interval: 2s, retries: 30}
    volumes: [pgdata:/var/lib/postgresql]

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command: >
      redpanda start --mode dev-container --smp 1 --memory 1G
      --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]
    healthcheck: {test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"], interval: 3s, retries: 30}

  valkey:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD", "valkey-cli", "ping"], interval: 2s, retries: 30}

  # In-memory S3 for development. Swap for MinIO/SeaweedFS/AWS S3 by changing
  # FBS_S3__ENDPOINT and credentials.
  s3:
    image: ${FBS_IMAGE:-fbs:dev}
    entrypoint: ["/usr/local/bin/devs3", "--addr", ":9000"]
    ports: ["9000:9000"]

  fakefb:
    image: ${FBS_IMAGE:-fbs:dev}
    entrypoint: ["/usr/local/bin/fakefb", "--addr", ":8090", "--pages", "5", "--posts", "30"]
    ports: ["8090:8090"]

  init:
    image: ${FBS_IMAGE:-fbs:dev}
    environment: *fbs-env
    volumes:
      - ./local.yaml:/etc/fbs/local.yaml:ro
    entrypoint: ["/usr/local/bin/fbctl", "migrate", "up"]
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}

  topics:
    image: ${FBS_IMAGE:-fbs:dev}
    environment: *fbs-env
    volumes:
      - ./local.yaml:/etc/fbs/local.yaml:ro
    entrypoint: ["/usr/local/bin/fbctl", "kafka", "apply", "--partitions-cap", "3", "--replicas", "1"]
    depends_on:
      redpanda: {condition: service_healthy}

  api:
    <<: *fbs
    entrypoint: ["/usr/local/bin/fbs-api"]
    ports: ["8080:8080"]

  scheduler:
    <<: *fbs
    entrypoint: ["/usr/local/bin/fbs-scheduler"]

  crawler:
    <<: *fbs
    entrypoint: ["/usr/local/bin/fbs-crawler", "--stages", "page,post,thread,retry"]

  persister:
    <<: *fbs
    entrypoint: ["/usr/local/bin/fbs-persister"]

  media-downloader:
    <<: *fbs
    entrypoint: ["/usr/local/bin/fbs-media-downloader"]

  media-janitor:
    <<: *fbs
    entrypoint: ["/usr/local/bin/fbs-media-janitor"]

volumes:
  pgdata: {}
