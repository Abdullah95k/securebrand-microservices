; PgBouncer as production runs it in front of PostgreSQL (the platform's
; docs/platform/postgres.md): transaction pooling, no prepared statements
; carried between transactions. make test-pgbouncer and CI's integration
; job run the test suite through it. Local and CI only: no authentication.
[databases]
* = host=127.0.0.1 port=5432 user=fbs password=fbs

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
unix_socket_dir =
auth_type = any
pool_mode = transaction
max_prepared_statements = 0
max_client_conn = 1000
default_pool_size = 40
server_reset_query =
server_idle_timeout = 10
