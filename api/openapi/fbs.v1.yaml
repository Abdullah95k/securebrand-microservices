openapi: 3.1.0
info:
  title: fbs - Facebook public page scraper API
  version: "1.0.0"
  description: |
    On-demand and scheduled scraping of public Facebook pages (logged out).
    All endpoints require `Authorization: Bearer fbs_<prefix>_<secret>`.
    Scopes: `jobs:write`, `pages:write`, `data:read`, `pii:read`, `discovery:write` (sending candidate
    accounts only), `admin` (implies all).
    Errors use RFC 9457 problem documents (`application/problem+json`).
servers:
  - url: /v1
security:
  - apiKey: []
paths:
  /jobs:
    post:
      summary: Scrape a page now (on-demand, priority lane p0)
      description: Requires `jobs:write`. Repeating a request with the same `Idempotency-Key` returns the original job (200).
      parameters:
        - in: header
          name: Idempotency-Key
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateJob'}
            example: {page: "https://www.facebook.com/nike", mode: auto, max_age_days: 90, video_policy: sd}
      responses:
        "202": {description: Job accepted, content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
        "200": {description: Existing job for this Idempotency-Key, content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
        "400": {$ref: '#/components/responses/Problem'}
        "429":
          description: >-
            Too many running jobs for this client (api.max_running_p0_jobs_per_client), the fleet's
            on-demand capacity is reached (api.max_running_p0_jobs), or rate limited. Retry after the
            Retry-After seconds.
          headers:
            Retry-After: {schema: {type: integer}}
          content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    get:
      summary: List jobs (own jobs and the scheduled jobs of registered pages; all jobs with admin)
      parameters:
        - {in: query, name: page, schema: {type: string}, description: Filter by page (URL, vanity or id)}
        - {in: query, name: status, schema: {$ref: '#/components/schemas/JobStatus'}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        "200":
          description: Jobs, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs: {type: array, items: {$ref: '#/components/schemas/Job'}}
                  next_cursor: {type: string}
  /jobs/{id}:
    get:
      summary: Job status, live counters while running, completeness when done
      parameters: [{$ref: '#/components/parameters/JobID'}]
      responses:
        "200": {description: Job, content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
        "404": {$ref: '#/components/responses/Problem'}
  /jobs/{id}/cancel:
    post:
      summary: Cancel a running job (its creator or an admin; a scheduled job only an admin)
      parameters: [{$ref: '#/components/parameters/JobID'}]
      responses:
        "202": {description: Cancelling}
        "404": {$ref: '#/components/responses/Problem'}
  /jobs/{id}/results:
    get:
      summary: Stream the job's data as NDJSON
      description: >-
        One `{"type":"page"}` line, then one `{"type":"post"}` line per post seen during the job, each
        followed by its `{"type":"comment"}` lines when `include=comments`. The last line is
        `{"type":"end"}` when the stream is whole, or `{"type":"error"}` when it stopped early: a client
        that sees neither lost the connection. Only the job's creator, a client registered to the page of a scheduled job, or an admin can read it.
      parameters:
        - {$ref: '#/components/parameters/JobID'}
        - {in: query, name: include, schema: {type: string, enum: [comments]}}
      responses:
        "200": {description: NDJSON stream, content: {application/x-ndjson: {schema: {type: string}}}}
  /pages:
    post:
      summary: Register a page for scheduled re-scrapes and start its backfill (lane p2)
      description: >-
        Requires `pages:write`. Registering a page again is safe: it keeps the schedule (an explicit
        interval only shortens it) and starts no second backfill unless `backfill: true` asks for one.
        A page that has had no job yet, such as one whose first registration failed to start its
        backfill, is backfilled again. The crawl options of the first registration stay.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterPage'}
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  page_ref: {type: string}
                  created: {type: boolean, description: The page was not registered before}
                  schedule: {type: object, description: The stored schedule after this registration}
                  backfill_job: {$ref: '#/components/schemas/Job'}
                  backfill_reused: {type: boolean, description: "backfill_job is the client's backfill of the page already under way (started with its own limits), not a new one"}
    get:
      summary: List registered pages and their schedules
      description: >-
        Each schedule carries `source`: `api` for a page a client registered, `discovery` for one a
        keyword search added (with `discovered_at` and `discovered_by_keyword_id`), `mention` for one
        the mentions flow added (with `discovered_at` and `discovered_via`, why: see
        MentionVia). Discovered and mentioned pages have no registering client, so only `admin` keys
        list them here.
      parameters:
        - {in: query, name: source, schema: {type: string, enum: [api, discovery, mention]}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        "200": {description: Pages}
  /pages/{page}:
    parameters: [{$ref: '#/components/parameters/Page'}]
    get:
      summary: Page profile and schedule
      responses:
        "200":
          description: Page
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: {$ref: '#/components/schemas/Page'}
                  page_ref: {type: string}
                  schedule: {type: object, description: The stored schedule after this registration}
        "404": {$ref: '#/components/responses/Problem'}
    patch:
      summary: Change the schedule
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: {type: boolean}
                interval_hours:
                  type: integer
                  minimum: 1
                  maximum: 720
                  description: Fixed interval; turns adaptive scheduling off for the page
                adaptive:
                  type: boolean
                  description: true hands the interval back to the adaptive tiers (by posting rate)
      responses:
        "204": {description: Updated}
    delete:
      summary: Unregister; `?purge=true` (admin) also erases the page's data
      parameters:
        - {in: query, name: purge, schema: {type: boolean}}
      responses:
        "204": {description: Unregistered}
        "202": {description: Erasure queued, content: {application/json: {schema: {$ref: '#/components/schemas/Erasure'}}}}
  /pages/{page}/posts:
    get:
      summary: Posts, newest first, with metrics and comment coverage
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {in: query, name: since, schema: {type: string, format: date-time}}
        - {in: query, name: type, schema: {type: string, enum: [status, photo, album, video, reel, link, share, event, live]}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        "200":
          description: Posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts: {type: array, items: {$ref: '#/components/schemas/Post'}}
                  next_cursor: {type: string}
  /pages/{page}/snapshots:
    get:
      summary: Follower/like history
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        "200": {description: Snapshots}
  /posts/{post}:
    get:
      summary: One post
      parameters: [{$ref: '#/components/parameters/Post'}]
      responses:
        "200": {description: Post, content: {application/json: {schema: {$ref: '#/components/schemas/Post'}}}}
  /posts/{post}/comments:
    get:
      summary: Comments and replies in thread order
      description: Author identity (`author.id`, `author.name`, ...) is only returned with the `pii:read` scope; `author_key` (pseudonymous) is always present.
      parameters:
        - {$ref: '#/components/parameters/Post'}
        - {in: query, name: parent_id, schema: {type: integer, format: int64}, description: Only direct replies to this comment}
        - {in: query, name: depth, schema: {type: integer}, description: "0 = top-level comments"}
        - {in: query, name: status, schema: {type: string, enum: [visible, deleted]}, description: Only comments in this status}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments: {type: array, items: {$ref: '#/components/schemas/Comment'}}
                  next_cursor: {type: string}
  /posts/{post}/metrics:
    get:
      summary: Engagement time series (a sample whenever values changed)
      parameters: [{$ref: '#/components/parameters/Post'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        "200": {description: Samples}
  /posts/{post}/media:
    get:
      summary: Media of a post and its download lifecycle
      parameters: [{$ref: '#/components/parameters/Post'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        "200": {description: Media, content: {application/json: {schema: {type: object, properties: {media: {type: array, items: {$ref: '#/components/schemas/Media'}}}}}}}
  /media/{media}:
    get:
      summary: One media item
      parameters:
        - {in: path, name: media, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Media, content: {application/json: {schema: {$ref: '#/components/schemas/Media'}}}}
  /discovery/keywords:
    get:
      summary: Discovery keywords, by id
      description: >-
        Requires `data:read`. Keywords are searched every `discovery.interval` for posts of the last
        `discovery.window`; each post found is a mention, and a poster not yet scheduled is added to
        the schedule (`source: discovery`). `fbctl discovery keywords seed` loads the Iraq list.
      parameters:
        - {in: query, name: language, schema: {type: string, enum: [en, ar, ckb, kmr]}}
        - {in: query, name: group, schema: {type: string}}
        - {in: query, name: enabled, schema: {type: boolean}}
        - {in: query, name: after, schema: {type: integer, format: int64}, description: Keyword id to list after (next_after)}
        - {in: query, name: limit, schema: {type: integer, default: 1000, maximum: 1000}}
      responses:
        "200":
          description: Keywords
          content:
            application/json:
              schema:
                type: object
                properties:
                  keywords: {type: array, items: {$ref: '#/components/schemas/Keyword'}}
                  next_after: {type: integer, format: int64, description: Set when more keywords follow}
    post:
      summary: Add a discovery keyword
      description: >-
        Requires `pages:write`. A term whose spelling folds to a keyword already listed in the same
        language (case, accents, Arabic letter forms, harakat, Sorani ZWNJ typing) returns that keyword
        with 200 and `created: false`, unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [term, language]
              properties:
                term: {type: string, maxLength: 100}
                language: {type: string, enum: [en, ar, ckb, kmr], description: 'English, Arabic, Sorani Kurdish (Arabic script), Kurmanji Kurdish (Latin script)'}
                group: {type: string, description: 'Free label, e.g. the governorate'}
                enabled: {type: boolean, default: true}
      responses:
        "201": {description: Added, content: {application/json: {schema: {$ref: '#/components/schemas/KeywordResult'}}}}
        "200": {description: Already listed, content: {application/json: {schema: {$ref: '#/components/schemas/KeywordResult'}}}}
        "400": {$ref: '#/components/responses/Problem'}
  /discovery/keywords/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer, format: int64}}
    patch:
      summary: Change a keyword's term, group or enabled state
      description: Requires `pages:write`. The language can't change.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                term: {type: string, maxLength: 100}
                group: {type: string}
                enabled: {type: boolean}
      responses:
        "200": {description: Keyword, content: {application/json: {schema: {$ref: '#/components/schemas/KeywordResult'}}}}
        "404": {$ref: '#/components/responses/Problem'}
        "409": {$ref: '#/components/responses/Problem'}
    delete:
      summary: Delete a keyword and its mentions; the pages it added stay scheduled
      responses:
        "204": {description: Deleted}
        "404": {$ref: '#/components/responses/Problem'}
  /discovery/mentions:
    get:
      summary: Posts discovery found, newest first
      description: >-
        Requires `data:read`. A mention of a profile (a person) shows who posted only with `pii:read`.
        `new_only` lists mentions whose poster was not scheduled before: `page_ref` set when discovery
        added it, unset when `discovery.max_new_per_day` stopped it.
      parameters:
        - {in: query, name: since, schema: {type: string, format: date-time}, description: 'Found at or after (default: 24 hours ago)'}
        - {in: query, name: before, schema: {type: string, format: date-time}, description: Found before (next_before)}
        - {in: query, name: keyword, schema: {type: integer, format: int64}}
        - {in: query, name: new_only, schema: {type: boolean}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        "200":
          description: Mentions
          content:
            application/json:
              schema:
                type: object
                properties:
                  mentions: {type: array, items: {$ref: '#/components/schemas/Mention'}}
                  next_before: {type: string, format: date-time, description: Set when more mentions follow}
  /discovery/accounts:
    get:
      summary: The checked-accounts list (mentions)
      description: >-
        Requires `data:read`. Every account (page or profile) our posts and comments mention, or that
        another tool proposed: how often and by how many of our pages it was mentioned, and for one
        not on our main list whether a check found it public. `status`: `unchecked` (waiting for its
        first check), `listed` (on the main list: only counted), `public` (added to the main list,
        `added_at`, or waiting for the daily cap), `private` (exists, but logged-out visitors see no
        posts, or it is restricted to logged-in viewers), `unavailable` (not found or removed). A
        private or unavailable account is checked again when mentioned after `recheck_at`
        (`mentions.recheck_after`, about 6 months). A failed check (a wall, a rate limit, a proxy error)
        records nothing about the account: `failures`, `last_error` and `retry_at` say when it is tried
        again; after `mentions.max_failures` in a row it is parked (still unchecked, `in_queue` false)
        until mentioned after `recheck_at`. Accounts that may be people (any `kind` but `page`) show their `account_ref`,
        `account_id`, `page_ref`, `first_comment_id` and `evidence_url` only with `pii:read`. The list
        keeps no names, text or pictures; erasure requests remove a person's or a page's rows, and
        `mentions.retention_days` removes accounts nobody mentioned or checked for that long.
      parameters:
        - {in: query, name: status, schema: {type: string, enum: [unchecked, listed, public, private, unavailable]}}
        - {in: query, name: source, schema: {type: string}, description: '`mention`, or the source a candidate came with'}
        - {in: query, name: kind, schema: {type: string, enum: [page, profile, unknown]}}
        - {in: query, name: checked_after, schema: {type: string, format: date-time}, description: Last conclusive check at or after}
        - {in: query, name: checked_before, schema: {type: string, format: date-time}, description: Last conclusive check before}
        - {in: query, name: added, schema: {type: boolean}, description: 'Only accounts the flow added to the main list: what was added and why'}
        - {in: query, name: order, schema: {type: string, enum: [priority, last_seen, checked], default: priority},
           description: 'priority: the check order (mentioned most, by most pages, most recently); last_seen; checked (newest first, checked accounts only)'}
        - {in: query, name: after, schema: {type: string}, description: Cursor from next_after}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts: {type: array, items: {$ref: '#/components/schemas/CheckedAccount'}}
                  next_after: {type: string, description: Set when more accounts follow}
        "400": {$ref: '#/components/responses/Problem'}
  /discovery/accounts/{ref}:
    parameters:
      - {$ref: '#/components/parameters/AccountRef'}
    get:
      summary: One account, its mention counts and the pages of ours that mention it most
      description: >-
        Requires `data:read`, and `pii:read` for an account that may be a person (any `kind` but `page`).
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: {$ref: '#/components/schemas/CheckedAccount'}
                  pages:
                    type: array
                    items:
                      type: object
                      properties:
                        page_id: {type: integer, format: int64}
                        mentions: {type: integer, format: int64}
                        last_seen_at: {type: string, format: date-time}
        "400": {$ref: '#/components/responses/Problem'}
        "403": {$ref: '#/components/responses/Problem'}
        "404": {$ref: '#/components/responses/Problem'}
  /discovery/accounts/{ref}/recheck:
    parameters:
      - {$ref: '#/components/parameters/AccountRef'}
    post:
      summary: Check an account again, ahead of the queue
      description: >-
        Requires `pages:write`. Whatever its last check found, the account is checked next (rechecks
        come before the priority order). It still counts toward `mentions.max_checks_per_day`.
        `409` when it is on the main list already; `503` while `mentions.enabled` is false.
      responses:
        "202": {description: Queued, content: {application/json: {schema: {type: object, properties: {account: {$ref: '#/components/schemas/CheckedAccount'}}}}}}
        "404": {$ref: '#/components/responses/Problem'}
        "409": {$ref: '#/components/responses/Problem'}
        "503": {$ref: '#/components/responses/Problem'}
  /discovery/candidates:
    post:
      summary: Send an account another tool found into the checks
      description: >-
        Requires `discovery:write` (a key that can do nothing else: `fbctl apikey create --scopes
        discovery:write`). The candidate counts as one more mention of its account and goes through
        the same checks, caps and lists as the accounts our own data mentions: a new account waits
        for its check (candidates start with priority `mentions.candidate_weight`), one on the main
        list is only counted, one checked within `mentions.recheck_after` and found not public is
        only counted, one checked before that is checked again. `keyword` and `evidence_url` are kept
        while the account may yet be added (and on its schedule entry when it is), and dropped once a
        check finds it not public. An erased person or page is never taken in (`result: ignored`).
        `503` while `mentions.enabled` is false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ref, source]
              properties:
                ref: {type: string, description: 'A facebook.com link to a page or profile (or one of its posts), a vanity name, or id:<n>'}
                source: {type: string, pattern: '^[a-z0-9][a-z0-9_.-]{0,31}$', description: 'The name of the tool sending it (not api, discovery or mention)'}
                evidence_url: {type: string, format: uri, maxLength: 2048, description: Where the tool found it}
                keyword: {type: string, maxLength: 200, description: What the tool searched for}
      responses:
        "202":
          description: Taken in
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_ref: {type: string, description: 'The account as the list names it: id:<n> or v:<name>'}
                  created: {type: boolean, description: The account was new to the list}
                  result:
                    type: string
                    enum: [queued, on_list, added, public_waiting, checked_recently, ignored]
                    description: >-
                      queued: waits for its check; on_list: on the main list; added: the flow added it;
                      public_waiting: public, waiting for the daily add cap; checked_recently: checked
                      within mentions.recheck_after and not public, only counted; ignored: not taken in.
        "400": {$ref: '#/components/responses/Problem'}
        "503": {$ref: '#/components/responses/Problem'}
  /erasure-requests:
    post:
      summary: GDPR erasure of an author or a page (admin)
      description: >-
        An author erasure also removes the person from the checked-accounts list (by id, and by every
        vanity name the list or the profile link knew them by, which are suppressed so links to them are
        never checked again), and erases as a page any profile of theirs the mentions flow added. A page
        erasure removes the page from the list, with its mentions of others.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_type]
              properties:
                subject_type: {type: string, enum: [author, page]}
                author_id: {type: string}
                profile_url: {type: string, description: 'Also a person known to the mentions flow by this link only (checked accounts)'}
                page_id: {type: integer, format: int64}
      responses:
        "202": {description: Queued, content: {application/json: {schema: {$ref: '#/components/schemas/Erasure'}}}}
  /erasure-requests/{id}:
    get:
      summary: Erasure status
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Erasure, content: {application/json: {schema: {$ref: '#/components/schemas/Erasure'}}}}
  /admin/queries:
    get:
      summary: Facebook query registry (admin)
      description: >-
        Every entry with its status and, when fbs-registry-sync checked it,
        last_check (ok | stale | drift | inconclusive, with the reason),
        last_checked_at and last_ok_at.
      responses:
        "200": {description: Registry entries}
  /admin/queries/{name}:
    put:
      summary: Set a registry entry (current doc_id / variables); crawlers reload within 30s
      parameters:
        - {in: path, name: name, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doc_id, friendly_name, parser, variables]
              properties:
                doc_id: {type: string}
                friendly_name: {type: string}
                parser: {type: string, enum: [timeline, comments, replies]}
                parser_version: {type: integer}
                status: {type: string, enum: [active, fallback, candidate, retired]}
                priority: {type: integer}
                variables: {type: object, description: 'JSON template; "{{name}}" placeholders are filled at request time'}
      responses:
        "200": {description: Saved}
  /admin/registry-sync/runs:
    get:
      summary: Latest fbs-registry-sync runs, newest first (admin)
      description: >-
        Each run's report lists the canary page loads, the doc_ids found in
        the bundles, new candidates, every check and its verdict, promotions,
        retired entries, failing queries (active doc_id stale or drifted with
        no replacement) and unchecked ones.
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 200, default: 20}}
      responses:
        "200": {description: Runs}
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
  parameters:
    JobID: {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    Page: {in: path, name: page, required: true, schema: {type: string}, description: Page id or vanity}
    Post: {in: path, name: post, required: true, schema: {type: integer, format: int64}}
    Limit: {in: query, name: limit, schema: {type: integer, default: 50, maximum: 500}}
    Cursor: {in: query, name: cursor, schema: {type: string}, description: Opaque keyset cursor from next_cursor}
    AccountRef: {in: path, name: ref, required: true, schema: {type: string},
      description: 'id:<n>, v:<name>, a vanity name, an id, or a URL-escaped facebook.com link'}
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Keyword:
      type: object
      properties:
        id: {type: integer, format: int64}
        term: {type: string}
        normalized: {type: string, description: The term folded for matching}
        language: {type: string, enum: [en, ar, ckb, kmr]}
        group: {type: string}
        enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_searched_at: {type: string, format: date-time}
    KeywordResult:
      type: object
      properties:
        keyword: {$ref: '#/components/schemas/Keyword'}
        created: {type: boolean}
    Mention:
      type: object
      properties:
        keyword_id: {type: integer, format: int64}
        keyword: {type: string}
        language: {type: string}
        post_id: {type: string}
        owner_id: {type: integer, format: int64}
        owner_ref: {type: string}
        owner_kind: {type: string, enum: [page, profile]}
        page_ref: {type: string, description: The poster's schedule entry}
        post_time: {type: string, format: date-time}
        found_at: {type: string, format: date-time}
        matched_existing: {type: boolean, description: The poster was scheduled before}
    CheckedAccount:
      type: object
      description: An account in the checked-accounts list. No names, text or pictures.
      properties:
        account_ref: {type: string, description: 'id:<n> or v:<name> (pii:read for a possible person)'}
        account_id: {type: integer, format: int64, description: 'Known from the mention or resolved by a check (pii:read for a possible person)'}
        kind: {type: string, enum: [page, profile, unknown], description: A hint until a check decides}
        source: {type: string, description: '`mention`, or the source a candidate came with'}
        status: {type: string, enum: [unchecked, listed, public, private, unavailable]}
        reason:
          type: string
          description: >-
            Why the last check decided: posts_visible, page (public); no_public_posts, timeline_hidden,
            restricted (private); not_found (unavailable)
        vias: {type: array, items: {type: string, enum: [tag, link, share, author, candidate]}, description: How it was mentioned}
        mentions: {type: integer, format: int64, description: Mentions counted (each post or comment once)}
        pages: {type: integer, description: Distinct pages of ours that mention it}
        priority: {type: number, description: 'Check order: ln(1+mentions) + 2 ln(1+pages) + weeks of recency (+ a candidate''s weight)'}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time, description: When the latest mention was written}
        in_queue: {type: boolean, description: Waits for a check}
        retry_at: {type: string, format: date-time, description: After a failed check, not before}
        queued_at: {type: string, format: date-time, description: A check is under way}
        requested_at: {type: string, format: date-time, description: A recheck was asked for}
        checks: {type: integer, description: Page loads spent on it}
        failures: {type: integer, description: Failed checks in a row}
        last_error: {type: string, description: 'Why the last check failed: login_wall, rate_limited, checkpoint, soft_error, transport, drift, names_nothing (confirmed by a second load)'}
        checked_at: {type: string, format: date-time, description: The last conclusive check}
        recheck_at: {type: string, format: date-time, description: Not public until a mention after this brings a new check}
        added_at: {type: string, format: date-time, description: The flow added it to the main list}
        page_ref: {type: string, description: Its main-list entry}
        first_page_id: {type: integer, format: int64, description: 'What first mentioned it (dropped when found not public)'}
        first_post_id: {type: integer, format: int64}
        first_comment_id: {type: integer, format: int64}
        keyword: {type: string, description: "A candidate's keyword (dropped when found not public)"}
        evidence_url: {type: string, description: "A candidate's evidence (dropped when found not public)"}
    MentionVia:
      type: object
      description: Why the mentions flow added a page (page_schedule.discovered_via)
      properties:
        account_ref: {type: string}
        source: {type: string}
        vias: {type: array, items: {type: string}}
        mentions: {type: integer, format: int64}
        pages: {type: integer}
        reason: {type: string}
        first_seen_at: {type: string, format: date-time}
        checked_at: {type: string, format: date-time}
        first_page_id: {type: integer, format: int64}
        first_post_id: {type: integer, format: int64}
        first_comment_id: {type: integer, format: int64}
        keyword: {type: string}
        evidence_url: {type: string}
    Problem:
      type: object
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
    CrawlOptions:
      type: object
      properties:
        max_age_days: {type: integer, description: "Oldest post age (default 365, capped by limits.max_age_cap_days)"}
        max_posts: {type: integer, format: int64}
        max_comments_per_post: {type: integer, format: int64}
        max_depth: {type: integer, minimum: 1, maximum: 5, description: "Comment nesting depth (default 3: comments, replies, replies to replies)"}
        include_comments: {type: boolean}
        include_replies: {type: boolean}
        include_media: {type: boolean}
        include_comment_media: {type: boolean}
        video_policy: {type: string, enum: [none, thumbnail, sd, hd]}
    CreateJob:
      allOf:
        - $ref: '#/components/schemas/CrawlOptions'
        - type: object
          required: [page]
          properties:
            page: {type: string, description: Page URL, vanity or numeric id}
            mode: {type: string, enum: [auto, full, incremental], default: auto}
    RegisterPage:
      allOf:
        - $ref: '#/components/schemas/CrawlOptions'
        - type: object
          required: [page]
          properties:
            page: {type: string}
            schedule:
              type: object
              properties:
                enabled: {type: boolean, default: true}
                interval_hours:
                  type: integer
                  description: >-
                    Fixed re-scrape interval. Without it the page is scheduled adaptively: its tier
                    (T0 3h ... T4 7d) follows its posting rate after every job.
            backfill: {type: boolean, description: "Full crawl now. Default: only for a page that has had no job yet."}
    JobStatus:
      type: string
      enum: [running, cancelling, completed, partial, failed, cancelled]
    Job:
      type: object
      properties:
        job_id: {type: string, format: uuid}
        kind: {type: string, enum: [on_demand, scheduled, backfill]}
        lane: {type: string, enum: [p0, p1, p2]}
        mode: {type: string, enum: [full, incremental]}
        page_ref: {type: string, example: "v:nike"}
        page_id: {type: integer, format: int64}
        status: {$ref: '#/components/schemas/JobStatus'}
        params: {type: object}
        counters:
          type: object
          additionalProperties: {type: integer}
          description: posts, comments, replies, requests, media_queued, pages_fetched, threads_spawned, tasks_failed, ...
        completeness:
          type: object
          description: Collected vs reported comments. "partial" jobs had truncated or failed posts.
          properties:
            posts: {type: integer}
            posts_complete: {type: integer}
            posts_truncated: {type: integer}
            posts_failed: {type: integer}
            median_ratio: {type: number}
            min_ratio: {type: number}
            comments_reported: {type: integer}
            comments_collected: {type: integer}
        pending_tasks: {type: integer}
        created_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
    Page:
      type: object
      properties:
        page_id: {type: integer, format: int64}
        vanity: {type: string}
        url: {type: string}
        name: {type: string}
        categories: {type: array, items: {type: string}}
        intro: {type: string}
        followers_count: {type: integer, format: int64}
        likes_count: {type: integer, format: int64}
        verified: {type: boolean}
        profile_pic_url: {type: string}
        cover_url: {type: string}
        contact: {type: object}
        status: {type: string, enum: [active, unavailable, restricted, suppressed]}
        first_seen_at: {type: string, format: date-time}
        last_scraped_at: {type: string, format: date-time}
    Post:
      type: object
      properties:
        post_id: {type: integer, format: int64}
        page_id: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        type: {type: string}
        permalink: {type: string}
        text: {type: string}
        text_ranges: {type: array, items: {type: object}}
        hashtags: {type: array, items: {type: string}}
        links: {type: array, items: {type: object}}
        shared_post_id: {type: integer, format: int64}
        is_pinned: {type: boolean}
        is_paid_partnership: {type: boolean}
        reaction_count: {type: integer, format: int64}
        reactions: {type: object, additionalProperties: {type: integer}}
        reactions_complete: {type: boolean, description: false when Facebook exposed only the top reaction types}
        comment_count: {type: integer, format: int64, description: Total incl. replies, as reported by Facebook}
        share_count: {type: integer, format: int64}
        view_count: {type: integer, format: int64}
        media_ids: {type: array, items: {type: string}}
        comments_collected: {type: integer, format: int64}
        replies_collected: {type: integer, format: int64}
        completeness: {type: number}
        comments_state: {type: string, enum: [none, partial, complete, truncated]}
        status: {type: string}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
    Comment:
      type: object
      properties:
        comment_id: {type: integer, format: int64}
        post_id: {type: integer, format: int64}
        parent_comment_id: {type: integer, format: int64}
        root_comment_id: {type: integer, format: int64}
        depth: {type: integer}
        author_key: {type: string, description: Hex HMAC of the author id (pseudonymous)}
        author:
          type: object
          properties:
            id: {type: string}
            name: {type: string}
            profile_url: {type: string}
            avatar_url: {type: string}
            type: {type: string}
            verified: {type: boolean}
        text: {type: string}
        attachments: {type: array, items: {type: object}}
        created_at: {type: string, format: date-time}
        edited: {type: boolean}
        is_op: {type: boolean}
        reaction_count: {type: integer, format: int64}
        reactions: {type: object}
        reply_count: {type: integer, format: int64}
        status:
          type: string
          enum: [visible, deleted]
          description: >-
            deleted: a full read of the post no longer returned this top-level comment (deleted by its
            author, removed or hidden by the page, or filtered by Facebook). The last content seen is kept.
            A later sighting makes it visible again.
        deleted_at: {type: string, format: date-time}
        edit_count: {type: integer, description: Text changes seen across scrapes}
        edited_at: {type: string, format: date-time, description: When the last text change was seen}
        redacted: {type: boolean}
    Media:
      type: object
      properties:
        media_id: {type: string, format: uuid}
        fb_media_id: {type: string}
        kind: {type: string}
        variant: {type: string, enum: [original, sd, hd, thumbnail, link_preview]}
        status: {type: string, enum: [discovered, stored, ready, deleted, expired, source_expired, failed, skipped]}
        s3_key: {type: string}
        size_bytes: {type: integer, format: int64}
        sha256: {type: string}
        delete_after: {type: string, format: date-time}
    Erasure:
      type: object
      properties:
        id: {type: string, format: uuid}
        subject_type: {type: string}
        status: {type: string, enum: [pending, done, failed]}
        stats: {type: object}
        created_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
